name: Dashboard
on:
  workflow_call:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test the compiled snapshot
        run: npm run test:browser
        env:
          DASHBOARD_STATIC: '1'
      - name: Package the tested build
        working-directory: .
        run: >-
          python3 .github/scripts/dashboard_bundle.py build
          --output "$RUNNER_TEMP/dashboard-bundle"
          --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve exact tested build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dashboard-bundle/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve browser evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dashboard-browser-evidence
          path: dashboard/test-results/
          retention-days: 14
