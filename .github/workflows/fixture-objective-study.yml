name: Exact fixture objective study
on:
  workflow_call:
permissions:
  contents: read
jobs:
  fixture-study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAX_PLATFORMS: cpu
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit/test_fixture_objectives.py tests/unit/test_fixture_objective_study.py
      - name: Generate and replay every arm
        run: uv run python -m thermo_lab.fixture_objective_study --output-dir results/fixture-objective-study
      - name: Require completion and show results
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/fixture-objective-study')
          done = json.loads((p / 'completion.json').read_text())
          assert done['status'] == 'fixture_study_complete'
          assert done['arms'] == 6 and done['samples'] == 0
          print((p / 'summary.md').read_text())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fixture-objective-study
          path: results/fixture-objective-study/
