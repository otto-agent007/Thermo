name: Exact return fixture full-row pilot
on:
  workflow_call:
permissions:
  contents: read
jobs:
  full-row-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAX_PLATFORMS: cpu
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit/test_return_fixture_full_row_pilot.py
      - name: Generate and replay all full-row arms
        run: uv run python -m thermo_lab.return_fixture_full_row_pilot --output-dir results/return-fixture-full-row-pilot
      - name: Require completed evidence
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          directory = Path('results/return-fixture-full-row-pilot')
          completion = json.loads((directory / 'completion.json').read_text())
          assert completion['status'] == 'return_fixture_full_row_pilot_complete'
          assert completion['arms'] == 4 and completion['samples'] == 0
          print((directory / 'summary.md').read_text())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: return-fixture-full-row-pilot
          path: results/return-fixture-full-row-pilot/
