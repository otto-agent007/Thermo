name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-budget-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Run and replay decision-component preflight
        run: >-
          uv run python -m thermo_lab.quality_budget_preflight
          --output-dir "${{ runner.temp }}/quality-budget-preflight"
      - name: Check component scope and show report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "quality-budget-preflight"
          completion = json.loads((output / "completion.json").read_text())
          assert completion["status"] == "component_preflight_complete"
          assert completion["full_m4g_ready"] is False
          assert completion["fits_executed"] == 0
          assert completion["evaluation_cells_executed"] == 0
          evidence = json.loads((output / "preflight.json").read_text())
          assert completion["result_digest"] == evidence["result_digest"]
          report = (output / "report.md").read_text()
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(report)
          PY
      - name: Preserve decision preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-budget-preflight
          path: ${{ runner.temp }}/quality-budget-preflight
          retention-days: 90
          if-no-files-found: error

  quality-budget-training-laws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Validate and replay seven training laws
        run: >-
          uv run python -m thermo_lab.quality_budget_training_preflight
          --output-dir "${{ runner.temp }}/quality-budget-training-laws"
      - name: Require bounded component completion
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "quality-budget-training-laws"
          completion = json.loads((output / "completion.json").read_text())
          assert completion["status"] == "training_law_component_complete"
          assert completion["full_m4g_ready"] is False
          assert completion["fits_executed"] == 0
          assert completion["evaluation_cells_executed"] == 0
          assert completion["parameter_updates"] == 0
          evidence = json.loads((output / "preflight.json").read_text())
          assert len(evidence["laws"]) == 7
          assert completion["result_digest"] == evidence["result_digest"]
          report = (output / "report.md").read_text()
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(report)
          PYCODE
      - name: Preserve training-law evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-budget-training-laws
          path: ${{ runner.temp }}/quality-budget-training-laws
          retention-days: 90
          if-no-files-found: error

  quality-budget-training-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Validate five updates at all seven laws
        run: >-
          uv run python -m thermo_lab.quality_budget_runner_preflight
          --output-dir "${{ runner.temp }}/quality-budget-training-runner"
      - name: Require bounded component completion
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "quality-budget-training-runner"
          completion = json.loads((output / "completion.json").read_text())
          assert completion["status"] == "training_runner_component_complete"
          assert completion["full_m4g_ready"] is False
          assert completion["study_fits_executed"] == 0
          assert completion["evaluation_cells_executed"] == 0
          assert completion["fixture_fits"] == 21
          assert completion["fixture_updates"] == 105
          evidence = json.loads((output / "preflight.json").read_text())
          assert len(evidence["fixture_fits"]) == 21
          assert evidence["independent_replay"]["steps_checked"] == 105
          assert completion["result_digest"] == evidence["result_digest"]
          report = (output / "report.md").read_text()
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(report)
          PYCODE
      - name: Preserve training-runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-budget-training-runner
          path: ${{ runner.temp }}/quality-budget-training-runner
          retention-days: 90
          if-no-files-found: error

  quality-budget-full-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Exercise complete fixture study and independent replay
        run: >-
          uv run python -m thermo_lab.quality_budget_full_preflight
          --output-dir "${{ runner.temp }}/quality-budget-full-preflight"
      - name: Require integrated completion
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "quality-budget-full-preflight"
          record = json.loads((output / "completion.json").read_text())
          assert record["status"] == "integrated_preflight_complete"
          assert record["production_fits"] == 0
          assert record["production_cells"] == 0
          assert record["full_m4g_ready"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write((output / "report.md").read_text())
          PYCODE
      - name: Preserve integrated preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-budget-full-preflight
          path: ${{ runner.temp }}/quality-budget-full-preflight
          retention-days: 90
          if-no-files-found: error

  asymmetry-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4,AVX512_ICL,AVX512_SPR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Run and replay bounded asymmetry study
        run: >-
          uv run python -m thermo_lab.asymmetry_preservation_audit
          --output-dir "${{ runner.temp }}/asymmetry-preservation"
      - name: Require complete study and show report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "asymmetry-preservation"
          completion = json.loads((output / "completion.json").read_text())
          expected = {
              "status": "complete", "full_study": True, "source_seeds": [0, 1, 2],
              "independent_initial_matrices": 1, "groups": 37,
              "conservation_penalty": 1.0, "asymmetry_coefficient": 1.0,
              "starts_per_group": 2, "updates_per_start": 100,
              "new_group_updates": 7400, "control_group_updates": 7400,
              "reference_cells_replayed": 3, "reference_replayed": True,
              "evaluated_cells": 4, "comparisons": 2,
              "horizon": 4, "operations": 500, "sample_count": 0,
          }
          assert all(completion[key] == value for key, value in expected.items())
          study = json.loads((output / "study.json").read_text())
          assert completion["result_digest"] == study["result_digest"]
          report = (output / "report.md").read_text()
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(report)
          PY
      - name: Preserve complete asymmetry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asymmetry-preservation
          path: ${{ runner.temp }}/asymmetry-preservation
          retention-days: 90
          if-no-files-found: error

  context-weighted-conservation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Run and replay complete context-weighting comparison
        run: >-
          uv run python -m thermo_lab.context_conservation_audit
          --output-dir "${{ runner.temp }}/context-weighted-conservation"
      - name: Require both matched grids and show report
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "context-weighted-conservation"
          completion = json.loads((output / "completion.json").read_text())
          assert completion["status"] == "complete"
          assert completion["full_grid"] is True
          assert completion["source_seeds"] == [0, 1, 2]
          assert completion["independent_initial_matrices"] == 1
          assert completion["groups"] == 37
          assert completion["penalties"] == [0, 1, 10]
          assert completion["starts_per_group"] == 2
          assert completion["updates_per_start"] == 100
          assert completion["new_group_updates"] == 22200
          assert completion["control_group_updates"] == 22200
          assert completion["control_replayed"] is True
          assert completion["horizon"] == 4
          assert completion["operations"] == 500
          assert completion["sample_count"] == 0
          assert completion["evaluated_cells"] == 8
          assert completion["comparisons"] == 6
          report = (output / "report.md").read_text()
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(report)
          PYCODE
      - name: Preserve complete context-weighting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-weighted-conservation
          path: ${{ runner.temp }}/context-weighted-conservation
          retention-days: 90
          if-no-files-found: error

  local-conservation-tradeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Run and replay full local conservation trade-off grid
        run: >-
          uv run python -m thermo_lab.conservation_tradeoff_audit
          --output-dir "${{ runner.temp }}/local-conservation-tradeoff"
      - name: Require complete grid and show report
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "local-conservation-tradeoff"
          completion = json.loads((output / "completion.json").read_text())
          assert completion["status"] == "complete"
          assert completion["full_grid"] is True
          assert completion["source_seeds"] == [0, 1, 2]
          assert completion["independent_initial_matrices"] == 1
          assert completion["groups"] == 37
          assert completion["penalties"] == [0, 1, 10]
          assert completion["starts_per_group"] == 2
          assert completion["updates_per_start"] == 100
          assert completion["total_group_updates"] == 22200
          assert completion["horizon"] == 4
          assert completion["operations"] == 500
          assert completion["sample_count"] == 0
          report = (output / "report.md").read_text()
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(report)
          PYCODE
      - name: Preserve complete local trade-off evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-conservation-tradeoff
          path: ${{ runner.temp }}/local-conservation-tradeoff
          retention-days: 90
          if-no-files-found: error

  conservation-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Run and replay complete conservation diagnostic
        run: >-
          uv run python -m thermo_lab.conservation_audit
          --output-dir "${{ runner.temp }}/conservation-diagnostic"
      - name: Require complete study and show report
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "conservation-diagnostic"
          completion = json.loads((output / "completion.json").read_text())
          assert completion["status"] == "complete"
          assert completion["full_three_seed_release"] is True
          assert completion["seeds"] == [0, 1, 2]
          assert completion["horizons"] == [4, "equilibrium"]
          assert completion["sample_count"] == 32768
          assert completion["operations"] == 500
          assert completion["parameter_updates"] == 0
          report = (output / "report.md").read_text()
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(report)
          PYCODE
      - name: Preserve bounded conservation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conservation-diagnostic
          path: ${{ runner.temp }}/conservation-diagnostic
          retention-days: 90
          if-no-files-found: error

  matched-training-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Extract predeclared archived source records
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          archive = Path("docs/experiment-reports/2026-09-11-bounded-finite-sweep-refinement")
          sources = Path(os.environ["RUNNER_TEMP"]) / "m4b-sources"
          sources.mkdir(exist_ok=False)
          for seed in range(3):
              name = f"seed-{seed:010d}.json"
              record = json.loads((archive / name).read_text())["source_record"]
              (sources / name).write_text(json.dumps(record))
          PY
      - name: Run complete matched-training-budget study
        run: >-
          uv run thermo-lab compare-training-laws
          "$RUNNER_TEMP/m4b-sources/seed-0000000000.json"
          "$RUNNER_TEMP/m4b-sources/seed-0000000001.json"
          "$RUNNER_TEMP/m4b-sources/seed-0000000002.json"
          --output-dir "$RUNNER_TEMP/matched-training-budget"
      - name: Require complete study and show report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "matched-training-budget"
          completion = json.loads((output / "completion.json").read_text())
          assert completion["status"] == "complete"
          assert completion["full_three_seed_release"] is True
          assert completion["completed_runs"] == 3
          assert completion["updates_per_arm"] == 5
          assert completion["evaluation_horizon"] == 4
          assert completion["selected_checkpoint"] == 5
          assert completion["matched_hardware_cost"] is False
          report = (output / "report.md").read_text()
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(report)
          PY
      - name: Preserve complete comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-training-budget
          path: ${{ runner.temp }}/matched-training-budget
          retention-days: 90
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Check lockfile is current
        run: uv lock --check --offline
      - name: Check formatting
        run: uv run ruff format --check --diff .
      - name: Lint
        run: uv run ruff check .
      - name: Check exact finite-sweep gradient contract
        run: >-
          uv run thermo-lab check-finite-sweep-gradients
          --output-dir "${RUNNER_TEMP}/finite-sweep-gradient-contract"
      - name: Preserve exact finite-sweep gradient evidence
        uses: actions/upload-artifact@v4
        with:
          name: finite-sweep-gradient-contract
          path: ${{ runner.temp }}/finite-sweep-gradient-contract
          retention-days: 90
          if-no-files-found: error
      - name: Build package artifacts
        run: uv build
      - name: Verify checked study configs in package artifacts
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          configs = (
              "configs/experiments/thrml-target-context-pasym-swap.toml",
              "configs/experiments/thrml-model-context-pasym-swap.toml",
              "configs/experiments/numpy-trajectory-reinforce-pasym-swap.toml",
              "configs/experiments/numpy-trajectory-reinforce-pasym-swap-one-step.toml",
              "configs/experiments/numpy-composed-pasym-swap-finite-gibbs.toml",
              "configs/experiments/numpy-composed-pasym-swap-trajectory-refinement-one-step.toml",
          )
          wheel, = glob.glob("dist/thermo_lab-*.whl")
          sdist, = glob.glob("dist/thermo_lab-*.tar.gz")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert all(any(name.endswith(config) for name in names) for config in configs)
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              assert all(any(name.endswith(config) for name in names) for config in configs)
          PY

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit-aggregation
            command: uv run pytest tests/unit/test_aggregation.py -m "not slow"
          - name: unit-target-context-results
            command: >-
              uv run pytest
              tests/unit/test_target_context_pasym_swap_results.py
              -m "not slow"
          - name: unit-rest
            command: >-
              uv run pytest tests/unit -m "not slow"
              --ignore=tests/unit/test_aggregation.py
              --ignore=tests/unit/test_target_context_pasym_swap_results.py
          - name: integration-composed-runner
            command: >-
              uv run pytest
              tests/integration/test_composed_pasym_swap_runner.py
              -m "not slow"
          - name: integration-composed-backend
            command: >-
              uv run pytest
              tests/integration/test_numpy_composed_pasym_swap_backend.py
              -m "not slow"
          - name: integration-context-conservation
            command: >-
              uv run pytest
              tests/integration/test_context_conservation_audit.py
              -m "not slow"
          - name: integration-asymmetry-preservation
            command: >-
              uv run pytest
              tests/integration/test_asymmetry_preservation_audit.py
              -m "not slow"
          - name: integration-quality-budget
            command: >-
              uv run pytest
              tests/integration/test_quality_budget_full_preflight.py
              tests/integration/test_quality_budget_study.py
              -m "not slow"
          - name: integration-other
            command: >-
              uv run pytest tests/integration -m "not slow"
              --ignore=tests/integration/test_composed_pasym_swap_runner.py
              --ignore=tests/integration/test_numpy_composed_pasym_swap_backend.py
              --ignore=tests/integration/test_context_conservation_audit.py
              --ignore=tests/integration/test_asymmetry_preservation_audit.py
              --ignore=tests/integration/test_quality_budget_full_preflight.py
              --ignore=tests/integration/test_quality_budget_study.py
          - name: upstream-regressions
            command: uv run pytest tests/upstream_regressions -m "not slow"
          - name: slow-contracts
            command: uv run pytest -m slow
    env:
      JAX_PLATFORMS: cpu
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Run test shard
        run: ${{ matrix.command }}

  experiment:
    name: experiment (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cross-library-smoke
            command: >-
              uv run thermo-lab smoke
              --output-dir "${RUNNER_TEMP}/thermo-smoke"
          - name: weighted-graph-walk
            command: >-
              uv run thermo-lab run
              configs/experiments/torx-weighted-graph-walk.toml
              --output-dir "${RUNNER_TEMP}/weighted-graph-walk"
          - name: independent-pasym-swap
            command: >-
              uv run thermo-lab run
              configs/experiments/thrml-independent-pasym-swap.toml
              --seeds 0,1,2
              --output-dir "${RUNNER_TEMP}/independent-pasym-swap"
          - name: target-context-pasym-swap
            command: >-
              uv run thermo-lab run
              configs/experiments/thrml-target-context-pasym-swap.toml
              --seeds 0,1,2
              --output-dir "${RUNNER_TEMP}/target-context-pasym-swap"
          - name: model-context-pasym-swap
            command: >-
              uv run thermo-lab run
              configs/experiments/thrml-model-context-pasym-swap.toml
              --seeds 0,1,2
              --output-dir "${RUNNER_TEMP}/model-context-pasym-swap"
          - name: trajectory-reinforce-estimator
            command: >-
              uv run thermo-lab run
              configs/experiments/numpy-trajectory-reinforce-pasym-swap.toml
              --seeds 0,1,2
              --output-dir "${RUNNER_TEMP}/trajectory-reinforce-estimator"
          - name: trajectory-reinforce-one-step
            command: >-
              uv run thermo-lab run
              configs/experiments/numpy-trajectory-reinforce-pasym-swap-one-step.toml
              --seeds 0,1,2
              --output-dir "${RUNNER_TEMP}/trajectory-reinforce-one-step"
          - name: composed-finite-gibbs
            command: >-
              uv run thermo-lab run
              configs/experiments/numpy-composed-pasym-swap-finite-gibbs.toml
              --seeds 0,1,2
              --output-dir "${RUNNER_TEMP}/composed-pasym-swap-finite-gibbs"
          - name: composed-trajectory-refinement-one-step
            command: >-
              uv run thermo-lab run
              configs/experiments/numpy-composed-pasym-swap-trajectory-refinement-one-step.toml
              --seeds 0,1,2
              --output-dir "${RUNNER_TEMP}/composed-trajectory-refinement-one-step"
    env:
      JAX_PLATFORMS: cpu
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Run checked experiment
        run: ${{ matrix.command }}
      - name: Audit frozen M1 pairs at finite sweeps
        if: matrix.name == 'composed-trajectory-refinement-one-step'
        run: >-
          uv run thermo-lab audit-finite-sweeps
          "$RUNNER_TEMP/composed-trajectory-refinement-one-step/runs/seed-0000000000.json"
          "$RUNNER_TEMP/composed-trajectory-refinement-one-step/runs/seed-0000000001.json"
          "$RUNNER_TEMP/composed-trajectory-refinement-one-step/runs/seed-0000000002.json"
          --output-dir "$RUNNER_TEMP/frozen-pair-finite-sweeps"
      - name: Require complete M2 release and show checked report
        if: matrix.name == 'composed-trajectory-refinement-one-step'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "frozen-pair-finite-sweeps"
          completion = json.loads((output / "completion.json").read_text())
          assert completion["status"] == "complete"
          assert completion["full_three_seed_release"] is True
          assert completion["horizon_cells"] == 21
          report = (output / "report.md").read_text()
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(report)
          PY
      - name: Run bounded finite-sweep refinement
        if: matrix.name == 'composed-trajectory-refinement-one-step'
        run: >-
          uv run thermo-lab refine-finite-sweeps
          "$RUNNER_TEMP/composed-trajectory-refinement-one-step/runs/seed-0000000000.json"
          "$RUNNER_TEMP/composed-trajectory-refinement-one-step/runs/seed-0000000001.json"
          "$RUNNER_TEMP/composed-trajectory-refinement-one-step/runs/seed-0000000002.json"
          --output-dir "$RUNNER_TEMP/bounded-finite-sweep-refinement"
      - name: Require complete M4 release and show checked report
        if: matrix.name == 'composed-trajectory-refinement-one-step'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "bounded-finite-sweep-refinement"
          completion = json.loads((output / "completion.json").read_text())
          assert completion["status"] == "complete"
          assert completion["full_three_seed_release"] is True
          assert completion["completed_runs"] == 3
          assert completion["updates_per_run"] == 5
          assert completion["horizon"] == 4
          assert completion["selected_checkpoint"] == 5
          report = (output / "report.md").read_text()
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(report)
          PY
      - name: Preserve checked M1 sources and M2 and M4 audit artifacts
        if: matrix.name == 'composed-trajectory-refinement-one-step' && always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-pair-finite-sweep-audit
          path: |
            ${{ runner.temp }}/composed-trajectory-refinement-one-step
            ${{ runner.temp }}/frozen-pair-finite-sweeps
            ${{ runner.temp }}/bounded-finite-sweep-refinement
          retention-days: 90
          if-no-files-found: error
