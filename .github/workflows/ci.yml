name: Thermo CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thermo-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  pipeline:
    name: Pipeline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Delivery and CI failure-path tests
        run: python -m unittest discover -s .github/tests -v
      - name: Validate workflow syntax
        run: bash .github/scripts/lint-actions.sh

  scientific:
    uses: ./.github/workflows/scientific.yml
  dashboard:
    uses: ./.github/workflows/dashboard.yml
  objective-fixture:
    uses: ./.github/workflows/fixture-objective-study.yml
  return-fixture:
    uses: ./.github/workflows/return-fixture-study.yml
  hop-fidelity:
    uses: ./.github/workflows/return-fixture-fidelity-pilot.yml
  full-row:
    uses: ./.github/workflows/return-fixture-full-row-pilot.yml

  raised-cap:
    uses: ./.github/workflows/raised-cap-path-kl-screen.yml

  required:
    name: CI required
    if: ${{ always() }}
    needs: [pipeline, scientific, dashboard, objective-fixture, return-fixture, hop-fidelity, full-row, raised-cap]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every CI group to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_gate.py
