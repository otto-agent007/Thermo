name: Exact return fixture study
on:
  workflow_call:
permissions:
  contents: read
jobs:
  return-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAX_PLATFORMS: cpu
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit/test_return_fixture_objectives.py tests/unit/test_return_fixture_study.py
      - name: Generate and replay every arm
        run: uv run python -m thermo_lab.return_fixture_study --output-dir results/return-fixture-study
      - name: Require completion and show results
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/return-fixture-study')
          done = json.loads((p / 'completion.json').read_text())
          assert done['status'] == 'return_fixture_study_complete'
          assert done['arms'] == 6 and done['samples'] == 0
          print((p / 'summary.md').read_text())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: return-fixture-study
          path: results/return-fixture-study/
