name: Exact return fixture study
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  return-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAX_PLATFORMS: cpu
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit/test_return_fixture_objectives.py tests/unit/test_return_fixture_study.py
      - name: Generate and replay every arm
        run: uv run python -m thermo_lab.return_fixture_study --output-dir results/return-fixture-study
      - name: Require completion and show results
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/return-fixture-study')
          done = json.loads((p / 'completion.json').read_text())
          assert done['status'] == 'return_fixture_study_complete'
          assert done['arms'] == 6 and done['samples'] == 0
          print((p / 'summary.md').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-fixture-study
          path: results/return-fixture-study/
