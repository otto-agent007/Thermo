schema_version = "1.0.0"
experiment_id = "torx.two_gate_statevector.v1"
seed = 0
sample_definition = "Exact final probability mass over basis states [00, 01, 10, 11]; not a Monte Carlo sample."

[model]
initial_distribution = [1.0, 0.0, 0.0, 0.0]
numeric_dtype = "float32"

[[model.gates]]
type = "pnot"
sites = [0]
theta = 0.0

[[model.gates]]
type = "pcnot"
sites = [0, 1]
theta = 0.0

[run]
expected_distribution = [0.5, 0.0, 0.25, 0.25]
absolute_tolerance = 1e-6
