schema_version = "1.0.0"
experiment_id = "thrml.ising_chain_exact_validation.v1"
seed = 7
sample_definition = "One recorded full five-spin state after two complete ordered block-Gibbs sweeps; recorded-state count is not an effective-independent-sample count."

[model]
biases = [0.20, -0.15, 0.05, 0.10, -0.05]
edges = [[0, 1], [1, 2], [2, 3], [3, 4]]
weights = [0.35, -0.25, 0.30, 0.20]
beta = 0.8
spin_values = [-1, 1]
energy_convention = "-beta*(sum(b_i*s_i)+sum(J_ij*s_i*s_j))"
numeric_dtype = "float32"

[run]
block_partition = [[0, 2, 4], [1, 3]]
n_warmup = 200
n_samples = 2500
steps_per_sample = 2
max_marginal_error_tolerance = 0.10
total_variation_tolerance = 0.15
key_policy = "split root key once into distinct initialization and sampling keys"
